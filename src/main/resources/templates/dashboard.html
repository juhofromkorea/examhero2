<!DOCTYPE html>
<!--
    Thymeleaf を使うために xmlns:th を指定します。
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!--
        スマートフォンでも見やすくするための設定です。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダッシュボード-ExamHero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class = "header-container">
            <span class = "header-logo">
                <a th:href = "@{/dashboard}">ExamHero</a>
            </span>

            <span class="toptitle">
                今やらなきゃいつやるの？
                今っきゃない
            </span>

            <form th:action = "@{/logout}" method = "post">
                <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
                >
                <button type = "submit" class="logoutbutton">
                    ログアウト
                </button>
            </form>
    </header>
    <main>
        <h1 class="top">ダッシュボード</h1>
        <section>
            <div class="count-category">
                <p>試験カテゴリ</p>
                <p th:text ="${categoryCount}"></p>
                <p>登録済みのカテゴリ数です</p>
            </div>

            <div class="count-category">
                <p>問題カード</p>
                <p th:text ="${questionCount}"></p>
                <p>登録した問題カードの合計数です。</p>
            </div>

            <div class="count-category">
                <p>今日解いた問題</p>
                <p th:text ="${todayReviewCount}"></p>
                <p>今日解答した問題数です。</p>
            </div>
        </section>
        <div class="action-section">

                <div
                    style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;"
                >
                    <h2>問題演習</h2>

                    <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                        <a class="createbutton" th:href="@{/categories}">
                            カテゴリ管理
                        </a>

                        <a class="createbutton" th:href="@{/questions/new}">
                            問題を登録
                        </a>
                    </div>
                </div>

                <!-- カテゴリがまだない場合 -->
                <div class="content-card" th:if="${#lists.isEmpty(categories)}">
                    <p class="page-description">
                        まだ試験カテゴリがありません。まずはカテゴリを作成してください。
                    </p>

                    <a class="primary-button inline-button" th:href="@{/categories/new}">
                        カテゴリを作成する
                    </a>
                </div>

                <!--
                    カテゴリ一覧です。
                    カテゴリをクリックすると、問題文一覧ではなく「問題番号一覧」に移動します。
                -->
                <div class="action-grid" th:if="${!#lists.isEmpty(categories)}">

                    <a
                        class="action-card"
                        th:each="category : ${categories}"
                        th:href="@{/questions/categories/{id}/select(id=${category.id})}"
                    >
                        <h3 th:text="${category.name}">
                            AWS SAA
                        </h3>

                        <p
                            th:if="${category.description != null and !#strings.isEmpty(category.description)}"
                            th:text="${category.description}"
                        >
                            このカテゴリの説明です。
                        </p>

                        <p th:if="${category.description == null or #strings.isEmpty(category.description)}">
                            このカテゴリの問題を解きます。
                        </p>
                    </a>
                </div>
        </div>
    </main>
</body>
</html>
