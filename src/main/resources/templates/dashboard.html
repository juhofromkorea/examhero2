<!DOCTYPE html>
<!--
    Thymeleaf を使うために xmlns:th を指定します。
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!--
        スマートフォンでも見やすくするための設定です。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダッシュボード-ExamHero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class = "header-container">
            <span class = "header-logo">
                <a th:href = "@{/dashboard}">ExamHero</a>
            </span>

            <span class="toptitle">
                今やらなきゃいつやるの？
                今っきゃない
            </span>

            <form th:action = "@{/logout}" method = "post">
                <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
                >
                <button type = "submit" class="createbutton">
                    ログアウト
                </button>
            </form>
    </header>
    <main class="dashboard-main">
        <div class="dashboard-content">
            <div class="dashboard-title">
                <h1 class="dashboard-title-heading">ダッシュボード</h1>

                <div class="dashboard-user-message">
                    <p>
                        <span th:text="${loginUsername}">ユーザー名</span>さん
                    </p>
                    <p>お疲れ様でした！</p>
                </div>
            </div>
            <section class="dashboard-stats">
                <div class="dashboard-stat-card">
                    <p class="dashboard-stat-label">試験カテゴリ</p>
                    <p class="dashboard-stat-number" th:text="${categoryCount}">0</p>
                    <p class="dashboard-stat-text">登録済みのカテゴリ数です</p>
                </div>
                <div class="dashboard-stat-card">
                    <p class="dashboard-stat-label">問題カード</p>
                    <p class="dashboard-stat-number" th:text="${questionCount}">0</p>
                    <p class="dashboard-stat-text">登録した問題カードの合計数です。</p>
                </div>
                <div class="dashboard-stat-card">
                    <p class="dashboard-stat-label">今日解いた問題</p>
                    <p class="dashboard-stat-number" th:text="${todayReviewCount}">0</p>
                    <p class="dashboard-stat-text">今日解答した問題数です。</p>
                </div>
            </section>
            <div class="dashboard-action-section">
                <div class="dashboard-action-header">
                    <h2>問題演習</h2>
                    <div class="dashboard-action-buttons">
                        <a class="createbutton" th:href="@{/categories}">カテゴリ管理</a>
                        <a class="createbutton" th:href="@{/questions/new}">問題を登録</a>
                    </div>
                </div>
                <div class="content-card" th:if="${#lists.isEmpty(categories)}">
                    <p class="empty-message">
                        まだ試験カテゴリがありません。まずはカテゴリを作成してください。
                    </p>
                    <a class="createbutton" th:href="@{/categories/new}">
                        カテゴリを作成する
                    </a>
                </div>
                <div class="dashboard-category-list" th:if="${!#lists.isEmpty(categories)}">
                    <a class="dashboard-category-row"
                    th:each="category : ${categories}"
                    th:href="@{/questions/categories/{id}/select(id=${category.id})}">
                        <span class="dashboard-category-name" th:text="${category.name}">
                            AWS SAA
                        </span>
                        <span class="dashboard-category-count">
                            問題数 
                            <span th:text="${questionCountMap[category.id]}">0</span>
                        </span>
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
