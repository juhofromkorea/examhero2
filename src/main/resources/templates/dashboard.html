<!DOCTYPE html>
<!--
    Thymeleaf を使うために xmlns:th を指定します。
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!--
        スマートフォンでも見やすくするための設定です。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダッシュボード-ExamHero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class = "header-container">
            <span class = "header-logo">
                <a th:href = "@{/dashboard}">ExamHero</a>
            </span>

            <span class="toptitle">
                今やらなきゃいつやるの？
                今っきゃない
            </span>

            <form th:action = "@{/logout}" method = "post">
                <input
                    type="hidden"
                    th:name="${_csrf.parameterName}"
                    th:value="${_csrf.token}"
                >
                <button type = "submit" class="logoutbutton">
                    ログアウト
                </button>
            </form>
    </header>
    <main>
        <h1 class="top">ダッシュボード</h1>
        <section>
            <div class="count-category">
                <p>試験カテゴリ</p>
                <p th:text ="${categoryCount}"></p>
                <p>登録済みのカテゴリ数です</p>
            </div>
            <div class="count-category">
                <p>問題カード</p>
                <p th:text ="${questionCount}"></p>
                <p>登録した問題カードの合計数です。</p>
            </div>
            <div class="count-category">
                <p>今日解いた問題</p>
                <p th:text ="${todayReviewCount}"></p>
                <p>今日解答した問題数です。</p>
            </div>
        </section>
        <div class="action-section">
            <div
                style="display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;"
            >
                <h2>問題演習</h2>

                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                    <a class="createbutton" th:href="@{/categories}">
                        カテゴリ管理
                    </a>

                    <a class="createbutton" th:href="@{/questions/new}">
                        問題を登録
                    </a>
                </div>
            </div>
            <div class="content-card" th:if="${#lists.isEmpty(categories)}">
                <p class="empty-message">
                    まだ試験カテゴリがありません。まずはカテゴリを作成してください。
                </p>

                <a class="createbutton" th:href="@{/categories/new}">
                    カテゴリを作成する
                </a>
            </div>
            <div class="dashboard-category-list" th:if="${!#lists.isEmpty(categories)}">
                <a
                class="dashboard-category-row"
                th:each="category : ${categories}"
                th:href="@{/questions/categories/{id}/select(id=${category.id})}"
                >
                    <span class="dashboard-category-name" th:text="${category.name}">
                        AWS SAA
                    </span>
                    <span class="dashboard-category-count">
                        問題：
                        <span th:text="${questionCountMap[category.id]}">0</span>
                    </span>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
