<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="signup-container">
        <div class="signup-card">
            <h1>会員登録</h1>
            <form th:action = "@{/signup}" th:object = "${signupForm}" method="post">
                <input
                    type = "hidden"
                    th:name = "${_csrf.parameterName}"
                    th:value = "${_csrf.token}"    
                >
                <div class="form-group">
                    <label for = "username">ユーザー名</label>
                    <input
                        type = "text"
                        th:field = "*{username}"
                        placeholder="田中太郎"
                    >
                    <p th:if = "${#fields.hasErrors('username')}" th:errors = "*{username}" class="field-error">
                        ユーザー名エラー
                    </p>
                </div>
            
                <div class="form-group">
                    <label for ="email">メールアドレス</label>
                    <input
                        type = "email"
                        th:field = "*{email}"
                        placeholder = "abc@example.com"
                    >
                    <p th:if = "${#fields.hasErrors('email')}" th:errors = "*{email}" class="field-error">
                        メールアドレスエラー
                    </p>
                </div>
                <div
                    th:if="${errorMessage}"
                    class="field-error"
                    th:text="${errorMessage}">
                </div>
                
                <div class="form-group">
                    <label for="password">パスワード(8文字以上)</label>
                    <input
                        type = "password"
                        th:field = "*{password}"
                        placeholder="8文字以上で入力してください"
                    >
                    <p th:if = "${#fields.hasErrors('password')}" th:errors = "*{password}" class="field-error">
                        パスワードエラー
                    </p>
                </div>
                <button type = "submit" class="button">
                    登録する
                </button>
            </form>
            <p class="body-link">
                すでにアカウントはお持ちですか？
                <a th:href = "@{/login}">ログイン</a><br>
                <a th:href = "@{/}">トップページに戻る</a>
            </p>
        </div>
    </div>
</body>
</html>
