<!DOCTYPE html>
<!--
    Thymeleaf を使うために xmlns:th を指定します。
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!--
        スマートフォンでも見やすくするための設定です。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カテゴリ作成-ExamHero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class = "header-container">
            <span class = "header-logo">
                <a  th:href = "@{/dashboard}">ExamHero</a>
            </span>

            <span>
                <a class="createbutton" th:href = "@{/questions}">問題一覧に戻る</a>
            </span>
        </div>
    </header>

    <main>
        <div class = "page-container">
            <div class="page-card">
                <h1 th:text="${questionCardId == null} ? '問題カード作成' : '問題カード編集'">問題カード作成</h1>
                <p th:text="${questionCardId == null} ? '4択形式の問題カードを1問登録できます。' : '問題カードの内容を編集できます。'">
                    4択形式の問題カードを1問登録できます。
                </p>
                <div class="empty-message" th:if="${#lists.isEmpty(categories)}">
                    まだカテゴリがありません。まずは「新しいカテゴリを作成」から1問登録してみましょう。
                </div>
                <form th:if="${!#lists.isEmpty(categories)}"
                    th:action="${questionCardId == null} ? @{/questions} : @{/questions/{id}/edit(id=${questionCardId})}"
                    th:object="${questionCardForm}"
                    method="post">
                    <div class="error-message" th:if = "${#fields.hasGlobalErrors()}">
                        <p th:each = "error : ${#fields.globalErrors()}">
                            エラーメッセージ
                        </p>
                    </div>

                    <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}"
                    >

                    <div class="form-group">
                        <label for = "examcategoryId">試験カテゴリ</label>
                        <select th:field = "*{examCategoryId}">
                            <option value="">選択してください</option>

                            <option
                                th:each = "category : ${categories}"
                                th:value = "${category.id}"
                                th:text = "${category.name}">
                            </option>
                        </select>
                        <p class="field-error" th:if = "${#fields.hasErrors('examCategoryId')}" th:errors="*{examCategoryId}">
                            カテゴリエラー
                        </p>
                    </div>
                    <div class="form-group">
                        <label for = "questionText">問題文</label>
                        <textarea
                            th:field = "*{questionText}"
                            rows = "7"
                            placeholder= "例：8桁の2進数10011101を10進数にせよ。">
                        </textarea>
                        <p class="field-error" th:if = "${#fields.hasErrors('questionText')}" th:errors = "*{questionText}">
                            問題文エラー
                        </p>
                    </div>
                    
                    <div class="form-group">
                        <label for = "optionA">選択肢A</label>
                        <input 
                            th:field = "*{optionA}"
                            placeholder="選択肢Aを入力してください。" 
                        >
                        <p class = "field-error" th:if="${#fields.hasErrors('optionA')}" th:errors="*{optionA}">
                            選択肢エラー
                        </p>
                    </div>

                    <div class="form-group">
                        <label for = "optionB">選択肢B</label>
                        <input 
                            th:field = "*{optionB}"
                            placeholder="選択肢Bを入力してください。" 
                        >
                        <p class = "field-error" th:if="${#fields.hasErrors('optionB')}" th:errors="*{optionB}">
                            選択肢エラー
                        </p>
                    </div>

                    <div class="form-group">
                        <label for = "optionC">選択肢C</label>
                        <input 
                            th:field = "*{optionC}"
                            placeholder="選択肢Cを入力してください。" 
                        >
                        <p class = "field-error" th:if="${#fields.hasErrors('optionC')}" th:errors="*{optionC}">
                            選択肢エラー
                        </p>
                    </div>

                    <div class="form-group">
                        <label for = "optionD">選択肢D</label>
                        <input 
                            th:field = "*{optionD}"
                            placeholder="選択肢Dを入力してください。" 
                        >
                        <p class = "field-error" th:if="${#fields.hasErrors('optionD')}" th:errors="*{optionD}">
                            選択肢エラー
                        </p>
                    </div>

                    <div class="form-group">
                        <label for = "correctAnswer">正解</label>
                        <select th:field = "*{correctAnswer}">
                            <option value="">選択してください</option>

                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                        <p class="field-error" th:if="${#fields.hasErrors('correctAnswer')}" th:errors="*{correctAnswer}">
                            正解エラー
                        </p>

                    </div>

                    <div class="form-group">
                        <label for = "explanation">解説</label>
                        <textarea
                            th:field = "*{explanation}"
                            rows ="6"
                            placeholder= "例：根気強く計算する">
                        </textarea>
                        <p class="field-error" th:if = "${#fields.hasErrors('explanation')}" th:errors = "*{explanation}">
                            解説エラー
                        </p>
                    </div>
                    <div 
                        style="display: flex; margin-right: 12px; align-items: center; gap: 16px; flex-wrap: wrap;"
                    >
                        <button type="submit" class="createbutton" th:text="${questionCardId == null} ? '保存する' : '更新する'" th:if="${!#lists.isEmpty(categories)}">
                            保存する
                        </button>
                        <a class="cancel" th:href = "@{/questions}">キャンセル</a>
                    </div>
                </form>
                <br>
                <div th:if="${#lists.isEmpty(categories)}">
                    <a class="createbutton" th:href = "@{/categories/new}" >新しいカテゴリを作成</a>
                    <a class="cancel" th:href = "@{/dashboard}">キャンセル</a>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
