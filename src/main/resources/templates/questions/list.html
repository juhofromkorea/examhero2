<!DOCTYPE html>
<!--
    Thymeleaf を使うために xmlns:th を指定します。
-->
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!--
        スマートフォンでも見やすくするための設定です。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>カテゴリ作成-ExamHero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class = "header-container">
            <span class = "header-logo">
                <a  th:href = "@{/dashboard}">ExamHero</a>
            </span>

            <span >
                <a class="logoutbutton" th:href ="@{/dashboard}">ダッシュボードへ</a>
            </span>
        </div>
    </header>
    <main>
        <div class = "page-container">
            <div class="page-card">
                <h1>問題カード一覧</h1>
                <p>作成した問題の一覧です。</p>
                <div class="message">
                    <div class="success-message" th:if="${successMessage}" th:text ="${successMessage}">
                        問題カード作成成功！
                    </div>
                </div>    
                <div class="empty-message" th:if="${#lists.isEmpty(questionCards)}">
                    まだ問題カードがありません。まずは「新しい問題カードを作成」から1問登録してみましょう。
                </div>
                <br>
                <table class="category-table">
                    <thead>
                        <tr>
                            <th>カテゴリ</th>
                            <th>問題文</th>
                            <th>正解</th>
                            <th>作成日時</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="questionCard:${questionCards}">
                            <td>
                                <span  th:text = "${questionCard.examCategory.name}">AWS SAA</span>
                            </td>
                            <td>
                                <p th:text ="${#strings.abbreviate(questionCard.questionText,80)}">問題文の一部がここに表示されます</p>
                            </td> 
                            <td>
                                <strong th:text ="${questionCard.correctAnswer}">A</strong>
                            </td>
                            <td th:text = "${#temporals.format(questionCard.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
                            
                            <td>
                                <a
                                    th:href="@{/questions/{id}(id=${questionCard.id})}"
                                    class="secondary-button"
                                >
                                    詳細
                                </a>
                            </td>

                        </tr>
                    </tbody>
                </table>
                <br>
                <a class="createbutton" th:href = "@{/questions/new}">新しい問題を作成</a>
                <a class="createbutton" 
                    th:each="category : ${categories}"
                    th:href="@{/questions/categories/{id}/select(id=${category.id})}"
                >
                </a>

            </div>
        </div>
    </main>
</body>
</html>
