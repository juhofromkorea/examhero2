<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'カテゴリ編集-ExamHero' : 'カテゴリ作成-ExamHero'">カテゴリ作成-ExamHero</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header>
    <div class="header-container">
        <span class="header-logo">
            <a th:href="@{/dashboard}">ExamHero</a>
        </span>

        <span>
            <a class="logoutbutton" th:href="@{/categories}">カテゴリ一覧に戻る</a>
        </span>
    </div>
</header>

<main>
    <div class="page-container">
        <div class="page-card">

            <h1 th:text="${isEdit} ? '試験カテゴリ編集' : '試験カテゴリ作成'">試験カテゴリ作成</h1>

            <p th:text="${isEdit} ? 'カテゴリ名と説明を編集できます。' : '基本情報技術者試験、AWS SAAなど登録したい資格名を入力してください。'">
                基本情報技術者試験、AWS SAAなど登録したい資格名を入力してください。
            </p>

            <form th:action="${isEdit} ? @{/categories/{id}/edit(id=${categoryId})} : @{/categories}"
                    th:object="${examCategoryForm}"
                    method="post">

                <input type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">

                <div class="error-message"
                        th:if="${#fields.hasGlobalErrors()}"
                        th:each="error : ${#fields.globalErrors()}"
                        th:text="${error}">
                    エラーメッセージ
                </div>

                <div class="form-group">
                    <label for="name">カテゴリ名</label>

                    <input type="text"
                            id="name"
                            th:field="*{name}"
                            placeholder="例：基本情報技術者試験">

                    <p class="field-error"
                        th:if="${#fields.hasErrors('name')}"
                        th:errors="*{name}">
                        カテゴリー名エラー
                    </p>
                </div>

                <div class="form-group">
                    <label for="description">カテゴリ説明文</label>

                    <textarea id="description"
                                th:field="*{description}"
                                placeholder="例：基本情報技術者試験のA問題をまとめたカテゴリ"></textarea>

                    <p class="field-error"
                        th:if="${#fields.hasErrors('description')}"
                        th:errors="*{description}">
                        説明文エラー
                    </p>
                </div>

                <button type="submit"
                        class="createbutton"
                        th:text="${isEdit} ? '更新する' : '保存する'">
                    保存する
                </button>

                <span>
                    <a class="cancel" th:href="@{/categories}">キャンセル</a>
                </span>

            </form>

        </div>
    </div>
</main>

</body>
</html>
